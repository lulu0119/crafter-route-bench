[project]
name = "crafter-route-bench"
version = "0.1.0"
description = "Compare a single Crafter agent with an Airi Spark role against gameplay, roleplay, and latency."
requires-python = ">=3.10"
dependencies = [
    "crafter>=1.8.3",
    "gym==0.23.1",
    "gymnasium>=1.3.0",
    "numpy>=2.2.6",
]

[project.scripts]
crafter-route-bench = "craftax_bench.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["craftax_bench"]
